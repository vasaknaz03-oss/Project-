# Запуск на сервере: см. podbor-server/README.md
#   cd podbor-server && cp .env.example .env && nano .env && docker compose up -d --build
services:
  api:
    build:
      context: ..
      dockerfile: podbor-server/Dockerfile
    env_file: .env
    environment:
      TRUST_PROXY: "1"
    volumes:
      - podbor-data:/data
    restart: unless-stopped

  # Caddy сам получает и продлевает HTTPS-сертификат Let's Encrypt для вашего домена
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  podbor-data:
  caddy-data:
  caddy-config:
