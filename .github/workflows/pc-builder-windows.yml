name: PodborPK — Windows build

on:
  push:
    paths:
      - 'pc-builder/**'
      - '.github/workflows/pc-builder-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pc-builder/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build portable .exe and installer
        run: npx electron-builder --win portable nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PodborPK-Windows
          path: pc-builder/dist/*.exe
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: podborpk-build-${{ github.run_number }}
          name: ПодборПК — сборка ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Готовые файлы для Windows:
            - **PodborPK-…-portable.exe** — запускается сразу, установка не нужна.
            - **PodborPK-…-setup.exe** — установщик с ярлыком на рабочем столе.

            Windows может предупредить «Неизвестный издатель» (у программы нет платной цифровой подписи): нажмите «Подробнее» → «Выполнить в любом случае».
          files: pc-builder/dist/*.exe
          make_latest: true
