name: PodborPK — Windows и macOS

on:
  push:
    paths:
      - 'pc-builder/**'
      - '.github/workflows/pc-builder-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pc-builder/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Server address and signing setup
        shell: bash
        # Адрес сервера ПодборПК — переменная репозитория PODBOR_SERVER (Settings → Secrets and variables → Actions → Variables).
        # Подпись кода — только если в секретах есть сертификат (.pfx в base64) и пароль; иначе сборка без подписи, как раньше.
        run: |
          if [ -n "${{ vars.PODBOR_SERVER }}" ]; then npm pkg set podborServer="${{ vars.PODBOR_SERVER }}"; fi
          if [ -n "$WIN_CSC" ]; then
            echo "CSC_LINK=$WIN_CSC" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$WIN_CSC_PASS" >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi
        env:
          WIN_CSC: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_PASS: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Build portable .exe and installer
        run: npx electron-builder --win portable nsis --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PodborPK-Windows
          path: pc-builder/dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: pc-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pc-builder/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Server address and signing setup
        run: |
          if [ -n "${{ vars.PODBOR_SERVER }}" ]; then npm pkg set podborServer="${{ vars.PODBOR_SERVER }}"; fi
          # С сертификатом Developer ID — настоящая подпись и нотаризация Apple; без него — подпись «без разработчика», как раньше
          if [ -n "$MAC_CSC" ]; then
            npm pkg delete build.mac.identity
            npm pkg set build.mac.hardenedRuntime=true build.mac.notarize=true --json
            echo "CSC_LINK=$MAC_CSC" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CSC_PASS" >> "$GITHUB_ENV"
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_PASS" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM" >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi
        env:
          MAC_CSC: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_PASS: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASS: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build .dmg (Apple Silicon and Intel)
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never

      - name: Check signature and architectures
        run: |
          for app in dist/mac-arm64/*.app dist/mac/*.app; do
            [ -d "$app" ] || continue
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            lipo -archs "$app/Contents/MacOS/"*
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PodborPK-macOS
          path: pc-builder/dist/*.dmg
          if-no-files-found: error

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: podborpk-build-${{ github.run_number }}
          name: ПодборПК — сборка ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            **Windows**
            - `PodborPK-…-portable.exe` — запускается сразу, установка не нужна.
            - `PodborPK-…-setup.exe` — установщик с ярлыком на рабочем столе.

            Windows может предупредить «Неизвестный издатель»: нажмите «Подробнее» → «Выполнить в любом случае».

            **macOS** (12 Monterey и новее)
            - `PodborPK-…-mac-arm64.dmg` — для Mac на Apple M1, M2, M3, M4.
            - `PodborPK-…-mac-x64.dmg` — для Mac на Intel.

            Не знаете, какой у вас Mac: значок яблока в левом верхнем углу → «Об этом Mac» → строка «Чип» (Apple M…) или «Процессор» (Intel).
            Откройте .dmg и перетащите ПодборПК в «Программы». При первом запуске macOS скажет, что не может проверить разработчика:
            откройте «Системные настройки» → «Конфиденциальность и безопасность» → внизу «Всё равно открыть».
            (На macOS 14 и старше достаточно правой кнопкой по программе → «Открыть».)
          files: files/*
          make_latest: true
